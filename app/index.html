<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coral Villa de Mengíbar</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#24407a" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15161a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Coral Mengíbar">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  /* ---------- Tokens: todos los colores, espacios, radios, tipografías y sombras salen de aquí ---------- */
  :root {
    /* Color: un neutro cálido de base, el azul de la coral como primario y colores semánticos */
    --color-bg: #fafaf7;
    --color-surface: #ffffff;
    --color-surface-2: #f0efe9;
    --color-paper: #ffffff;            /* la página de la partitura: siempre blanca, como el papel */
    --color-fg: #1d1d1b;
    --color-fg-muted: #6b6b66;         /* 5:1 sobre el fondo */
    --color-border: #dcdcd6;           /* separadores y tarjetas */
    --color-border-control: #8e8e87;   /* bordes de controles: 3:1 sobre blanco */
    --color-primary: #24407a;
    --color-on-primary: #ffffff;
    --color-primary-soft: #e8edf7;
    --color-danger: #b3261e;
    --color-on-danger: #ffffff;
    --color-danger-border: #d58a85;
    --color-note-bg: #fff7e6;          /* apuntes y modo Corregir */
    --color-note-border: #b5731c;
    --color-note-fg: #8a5a00;
    --color-cursor: #c97f14;           /* marca del compás que suena (3:1 sobre blanco) */
    --color-scrim: rgba(250, 250, 247, .9);
    /* Espaciado: escala de 4/8 px */
    --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-6: 24px;
    /* Radios */
    --radius-s: 8px; --radius-m: 12px; --radius-pill: 999px;
    /* Tipografía: base 16 px y cuatro tamaños más */
    --font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-xs: 13px; --font-s: 14px; --font-m: 16px; --font-l: 18px; --font-xl: 20px;
    --line-height: 1.45;
    /* Sombras y tamaños */
    --shadow-card: 0 1px 6px rgba(0, 0, 0, .12);
    --shadow-bar: 0 -4px 16px rgba(0, 0, 0, .06);
    --tap: 44px;                       /* área táctil mínima */
    --tap-primary: 56px;               /* botón principal de la barra de transporte */
    --icon-s: 18px; --icon-m: 22px; --icon-l: 28px;
    --alto-controles: 200px;           /* lo ajusta la app al alto real de la barra fija */
    color-scheme: light;
  }
  /* Modo oscuro: mismos tokens con otros valores. La partitura sigue siendo papel blanco (notas negras), y la
     interfaz alrededor se oscurece; el primario pasa a un azul claro con texto oscuro encima */
  @media (prefers-color-scheme: dark) {
    :root {
      --color-bg: #15161a;
      --color-surface: #1e2026;
      --color-surface-2: #292c34;
      --color-fg: #ececea;
      --color-fg-muted: #a9a9a3;
      --color-border: #353840;
      --color-border-control: #7f828b;
      --color-primary: #9db3ee;
      --color-on-primary: #0f1a33;
      --color-primary-soft: #263252;
      --color-danger: #f28b82;
      --color-on-danger: #2b0b09;
      --color-danger-border: #8a3a35;
      --color-note-bg: #2e2616;
      --color-note-border: #c9933f;
      --color-note-fg: #f0c57a;
      --color-scrim: rgba(21, 22, 26, .9);
      --shadow-card: 0 1px 8px rgba(0, 0, 0, .6);
      --shadow-bar: 0 -4px 16px rgba(0, 0, 0, .4);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; overflow-x: hidden; background: var(--color-bg); color: var(--color-fg); font: var(--font-m)/var(--line-height) var(--font-family); }
  header { position: sticky; top: 0; z-index: 5; background: var(--color-bg); border-bottom: 1px solid var(--color-border); padding: var(--space-2) var(--space-3); display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; }
  header h1 { font-size: var(--font-l); margin: 0; font-weight: 600; flex: 1 1 auto; display: flex; align-items: center; gap: var(--space-2); }
  header h1 img { width: 40px; height: 40px; border-radius: 50%; }
  /* Iconos y estados de interacción comunes a todos los controles */
  .ico { width: var(--icon-m); height: var(--icon-m); flex: 0 0 auto; }
  button { cursor: pointer; transition: background-color .15s ease-out, border-color .15s ease-out, color .15s ease-out, filter .15s ease-out, transform .15s ease-out; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #resumenAjustes .flecha { transition: transform .2s ease-out; }
  /* Menos movimiento: sin transiciones ni animaciones para quien lo pida en el sistema */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
  :focus-visible { outline: 3px solid var(--color-primary); outline-offset: 2px; }
  @media (hover: hover) { button:not(:disabled):hover { filter: brightness(.95); } }
  button:not(:disabled):active { filter: brightness(.9); }
  /* El foco por teclado no debe quedar bajo la cabecera fija ni bajo la barra de abajo */
  html { scroll-padding: 130px 0 calc(var(--alto-controles) + var(--space-4)); }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  /* Pantalla siempre encendida: bombilla apagada (puede apagarse) o encendida (no se apagará) */
  #pantalla { display: inline-flex; align-items: center; justify-content: center; width: var(--tap); height: var(--tap); padding: 0; border: 0; border-radius: var(--radius-s); background: none; color: var(--color-fg-muted); }
  #pantalla .si, #pantalla.activa .no { display: none; }
  #pantalla.activa .si { display: block; }
  #pantalla.activa { color: var(--color-primary); }
  button.enlace { background: none; border: 0; padding: 0 var(--space-1); font: inherit; color: var(--color-fg); text-decoration: underline dotted; text-underline-offset: 3px; }
  /* Los campos van siempre a 16 px aunque estén dentro de un texto menor: con menos, Safari en iPhone y iPad amplía
     toda la página al tocarlos y la barra fija de abajo se sale por los márgenes */
  select, input[type=number], input[type=text] { font: inherit; font-size: var(--font-m); min-height: var(--tap); padding: var(--space-2) var(--space-3); border: 1px solid var(--color-border-control); border-radius: var(--radius-s); background: var(--color-surface); color: var(--color-fg); }
  input[type=range], input[type=checkbox] { accent-color: var(--color-primary); }
  .voces-wrap { padding: var(--space-2) var(--space-3) 0; }
  .voces { display: flex; flex-wrap: wrap; gap: var(--space-2); }
  .voces button { flex: 1 1 auto; min-width: 4.5em; min-height: var(--tap); padding: var(--space-2); border: 1px solid var(--color-border-control); background: var(--color-surface); border-radius: var(--radius-m); font: inherit; font-weight: 600; color: var(--color-fg); white-space: nowrap; }
  .voces button.activa { background: var(--color-primary); color: var(--color-on-primary); border-color: var(--color-primary); }
  /* Sin relleno lateral: OSMD dibuja el SVG al ancho del contenedor (relleno incluido) y el cursor se coloca en esos
     píxeles; si el SVG se encogiera para caber (max-width), el cursor se iría descuadrando hacia abajo y a la derecha */
  #partitura { padding: var(--space-2) 0 calc(var(--alto-controles) + 20px); min-height: 60vh; position: relative; background: var(--color-paper); color: #1d1d1b; }
  /* Modo Corregir (para el director): barra dentro de la cabecera, que ya es fija */
  #barraCorregir { flex-basis: 100%; background: var(--color-note-bg); border: 1px solid var(--color-note-border); border-radius: var(--radius-m); padding: var(--space-2) var(--space-3); font-size: var(--font-s); }
  #barraCorregir .fila { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-3); align-items: center; }
  #barraCorregir .fila + .fila { margin-top: var(--space-2); }
  #barraCorregir button { display: inline-flex; align-items: center; justify-content: center; min-height: var(--tap); min-width: var(--tap); padding: var(--space-2) var(--space-3); font: inherit; font-size: var(--font-l); border-radius: var(--radius-s); border: 1px solid var(--color-border-control); background: var(--color-surface); color: var(--color-fg); }
  #barraCorregir button.principal { background: var(--color-primary); color: var(--color-on-primary); border-color: var(--color-primary); font-size: var(--font-s); }
  #barraCorregir button.peligro { color: var(--color-danger); border-color: var(--color-danger-border); }
  #barraCorregir select { font-size: var(--font-m); }
  #barraCorregir .cuadra-mal { color: var(--color-danger); font-weight: 600; }
  #corrLetra { width: 100px; }
  #notaSel { position: absolute; border: 2px solid var(--color-cursor); border-radius: 50%; background: color-mix(in srgb, var(--color-cursor) 28%, transparent); pointer-events: none; z-index: 3; box-shadow: 0 0 0 3px color-mix(in srgb, var(--color-cursor) 25%, transparent); }
  #partitura svg { max-width: 100%; height: auto; }
  #estado { color: var(--color-fg-muted); font-size: var(--font-s); padding: var(--space-1) var(--space-3); }
  .controles { position: fixed; bottom: 0; left: 0; right: 0; background: var(--color-surface); border-top: 1px solid var(--color-border); padding: var(--space-2) var(--space-3) calc(var(--space-2) + env(safe-area-inset-bottom)); display: grid; gap: var(--space-2); z-index: 5; box-shadow: var(--shadow-bar); }
  .fila { display: flex; gap: var(--space-2); align-items: center; flex-wrap: wrap; }
  .fila label { font-size: var(--font-s); color: var(--color-fg-muted); display: flex; align-items: center; gap: var(--space-2); }
  .fila input[type=range] { flex: 1; min-width: 80px; height: var(--tap); margin: 0; }
  #tempoVal { display: inline-flex; align-items: center; min-height: var(--tap); min-width: 5.5em; cursor: pointer; color: var(--color-fg); }
  #desde, #hasta { width: 64px; padding: var(--space-1) var(--space-2); }
  /* Barra de transporte, con el patrón de cualquier reproductor: Reproducir/Pausa es un círculo mayor en el centro,
     con «Al principio» y «Parar» a los lados; el compás queda a la izquierda y el lápiz de apuntes a la derecha */
  .transporte { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: var(--space-2); }
  .transporte .grupo { display: flex; align-items: center; justify-content: center; gap: var(--space-3); }
  .transporte .compas { justify-self: start; font-size: var(--font-s); color: var(--color-fg-muted); white-space: nowrap; }
  .transporte .compas strong { font-size: var(--font-m); font-weight: 600; font-variant-numeric: tabular-nums; color: var(--color-fg); }
  .transporte button { display: inline-flex; align-items: center; justify-content: center; width: var(--tap); height: var(--tap); padding: 0; border-radius: 50%; border: 1px solid transparent; background: var(--color-surface-2); color: var(--color-fg); flex: 0 0 auto; }
  .transporte button.principal { position: relative; width: var(--tap-primary); height: var(--tap-primary); background: var(--color-primary); color: var(--color-on-primary); border-color: var(--color-primary); box-shadow: var(--shadow-card); }
  .transporte button.principal .ico { width: var(--icon-l); height: var(--icon-l); }
  /* Estados: en hover cambia el color (en claro se oscurece, en oscuro se aclara), al pulsar se encoge un poco */
  @media (hover: hover) {
    .transporte button:not(:disabled):hover { filter: none; background: color-mix(in srgb, var(--color-surface-2), var(--color-fg) 8%); }
    .transporte button.principal:not(:disabled):hover { background: color-mix(in srgb, var(--color-primary), var(--color-fg) 12%); border-color: transparent; }
  }
  .transporte button:not(:disabled):active { filter: none; transform: scale(.94); }
  .transporte button.principal:disabled { opacity: 1; background: var(--color-primary-soft); color: var(--color-primary); border-color: transparent; box-shadow: none; }
  /* Mientras se descarga el sonido: un anillo que gira alrededor del botón principal (quieto si se pide menos movimiento) */
  .transporte button.principal.cargando::after { content: ''; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--color-primary) 25%, transparent); border-top-color: var(--color-primary); animation: gira .9s linear infinite; }
  @keyframes gira { to { transform: rotate(360deg); } }
  .transporte .lado { display: flex; justify-content: flex-end; align-items: center; gap: var(--space-2); justify-self: end; }
  /* La barra se puede esconder (en una ventana pequeña, como la del gestor, tapa media partitura): queda solo una
     pestaña abajo a la derecha para volver a sacarla. Mientras está escondida, el cuerpo no deja hueco */
  body.controlesOcultos .controles { display: none; }
  #mostrarControles { display: none; position: fixed; right: var(--space-3); bottom: calc(var(--space-3) + env(safe-area-inset-bottom)); z-index: 5; align-items: center; gap: var(--space-2); min-height: var(--tap); padding: var(--space-2) var(--space-3); border-radius: var(--radius-pill); border: 1px solid var(--color-border-control); background: var(--color-surface); color: var(--color-fg); font: inherit; font-size: var(--font-s); box-shadow: var(--shadow-card); }
  #mostrarControles .ico { transform: rotate(180deg); }
  body.controlesOcultos #mostrarControles { display: inline-flex; }
  .chip { font-size: var(--font-s); padding: var(--space-1) var(--space-3); border-radius: var(--radius-pill); background: var(--color-surface-2); border: 1px solid var(--color-border); display: inline-flex; align-items: center; gap: var(--space-2); min-height: 36px; }
  label.chip { min-height: var(--tap); color: var(--color-fg); }
  .chip input[type=checkbox] { width: 20px; height: 20px; margin: 0; }
  #cargando { position: fixed; inset: 0; background: var(--color-scrim); display: grid; place-items: center; z-index: 10; font-size: var(--font-m); }
  .vista { display: flex; gap: var(--space-2); margin: var(--space-2) var(--space-3) 0; }
  .vista button { flex: 1; min-height: var(--tap); padding: var(--space-2) 0; border: 1px solid var(--color-border-control); background: var(--color-surface); border-radius: var(--radius-s); font: inherit; font-size: var(--font-s); color: var(--color-fg); }
  .vista button.activa { background: var(--color-primary-soft); border-color: var(--color-primary); color: var(--color-primary); font-weight: 600; }
  #pdfVista { display: none; padding: var(--space-2) var(--space-1) calc(var(--alto-controles) + 20px); }
  .pagina { position: relative; margin: 0 auto var(--space-3); box-shadow: var(--shadow-card); background: var(--color-paper); border: 1px solid var(--color-border); }
  .pagina img { display: block; width: 100%; height: auto; aspect-ratio: auto 1 / 1.414; } /* hueco A4 mientras carga */
  .pagina .capa { position: absolute; inset: 0; }
  .pdfCursor { position: absolute; background: color-mix(in srgb, var(--color-cursor) 35%, transparent); border-left: 2px solid var(--color-cursor); pointer-events: none; }
  /* Apuntes: lienzo sobre cada página; solo recibe el dedo/lápiz cuando está activado el modo Apuntes */
  .pagina canvas.apuntes { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  body.apuntando .pagina canvas.apuntes { pointer-events: auto; touch-action: pinch-zoom; cursor: crosshair; }
  /* Con lápiz detectado, la mano apoyada no debe ni escribir ni mover la página */
  body.apuntando.conLapiz .pagina canvas.apuntes { touch-action: none; }
  /* El botón del lápiz vive en la barra fija de abajo, para poder escribir también al final de la página */
  #vistaApuntes.activa { background: var(--color-note-bg); border-color: var(--color-note-border); color: var(--color-note-fg); }
  #barraApuntes { display: none; margin: 0; padding: var(--space-2); background: var(--color-note-bg); border: 1px solid var(--color-note-border); border-radius: var(--radius-m); gap: var(--space-2); flex-wrap: wrap; align-items: center; font-size: var(--font-s); }
  body.apuntando #barraApuntes { display: flex; }
  #barraApuntes button { display: inline-flex; align-items: center; justify-content: center; min-height: var(--tap); min-width: var(--tap); padding: var(--space-2) var(--space-3); border-radius: var(--radius-s); border: 1px solid var(--color-border-control); background: var(--color-surface); font: inherit; font-size: var(--font-s); color: var(--color-fg); }
  #barraApuntes button.activa { border-color: var(--color-primary); box-shadow: 0 0 0 2px color-mix(in srgb, var(--color-primary) 25%, transparent); font-weight: 600; }
  #barraApuntes button.color::before { content: ''; display: inline-block; width: 16px; height: 16px; border-radius: 50%; background: var(--c); vertical-align: -3px; border: 1px solid rgba(0, 0, 0, .2); }
  #barraApuntes .sep { flex: 1; }
  /* Ajustes plegados: una fila que resume tempo, mezcla y sonido; al tocarla se despliegan los controles */
  #resumenAjustes { display: flex; align-items: center; gap: var(--space-2); width: 100%; min-height: var(--tap); padding: var(--space-2) var(--space-3); border: 1px solid var(--color-border-control); border-radius: var(--radius-m); background: var(--color-surface-2); color: var(--color-fg); font: inherit; font-size: var(--font-s); text-align: left; cursor: pointer; }
  #resumenAjustes .etiqueta { font-weight: 600; }
  #resumenAjustes .texto { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--color-fg-muted); }
  #resumenAjustes .flecha { flex: 0 0 auto; }
  #resumenAjustes[aria-expanded=true] .flecha { transform: rotate(180deg); }
  #panelAjustes { display: grid; gap: var(--space-2); }
  #panelAjustes[hidden] { display: none; }
  #version { margin-left: auto; align-self: center; font-size: var(--font-xs); color: var(--color-fg-muted); }
  /* Aviso de que no hay conexión (la app sigue funcionando con lo guardado) */
  #sinConexion { background: var(--color-note-bg); color: var(--color-note-fg); border-bottom: 1px solid var(--color-note-border); padding: var(--space-1) var(--space-3); font-size: var(--font-s); text-align: center; }
  /* Carga, estado vacío y error: una tarjeta centrada sobre la página */
  .tarjeta { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-m); box-shadow: var(--shadow-card); padding: var(--space-4) var(--space-6); width: min(92vw, 380px); text-align: center; }
  .tarjeta h2 { font-size: var(--font-l); margin: 0 0 var(--space-2); }
  .tarjeta p { margin: 0 0 var(--space-3); color: var(--color-fg-muted); }
  .tarjeta button.principal { min-height: var(--tap); padding: var(--space-2) var(--space-4); border-radius: var(--radius-s); border: 1px solid var(--color-primary); background: var(--color-primary); color: var(--color-on-primary); font: inherit; }
  /* Esqueleto de pentagrama mientras se dibuja la partitura */
  .esqueleto { display: grid; gap: var(--space-2); margin: var(--space-3) auto 0; width: 70%; }
  .esqueleto i { display: block; height: 6px; border-radius: var(--radius-pill); background: var(--color-surface-2); animation: pulso 1.2s ease-in-out infinite; }
  .esqueleto i:nth-child(2) { animation-delay: .2s; } .esqueleto i:nth-child(3) { animation-delay: .4s; }
  @keyframes pulso { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }
  /* Diálogos propios (confirmar, avisar, pedir un texto) en lugar de los del navegador */
  .dialogo { border: 1px solid var(--color-border); border-radius: var(--radius-m); background: var(--color-surface); color: var(--color-fg); padding: var(--space-4); width: min(92vw, 420px); box-shadow: var(--shadow-card); }
  .dialogo::backdrop { background: rgba(0, 0, 0, .45); }
  .dialogo h2 { font-size: var(--font-l); margin: 0 0 var(--space-2); }
  .dialogo p { margin: 0 0 var(--space-3); }
  .dialogo input[type=text] { width: 100%; margin-bottom: var(--space-3); }
  .dialogo details { font-size: var(--font-s); color: var(--color-fg-muted); margin-bottom: var(--space-3); }
  .dialogo pre { white-space: pre-wrap; font-size: var(--font-xs); margin: var(--space-2) 0 0; }
  .dialogo .acciones { display: flex; gap: var(--space-2); justify-content: flex-end; flex-wrap: wrap; }
  .dialogo .acciones button { min-height: var(--tap); padding: var(--space-2) var(--space-4); border-radius: var(--radius-s); border: 1px solid var(--color-border-control); background: var(--color-surface); color: var(--color-fg); font: inherit; }
  .dialogo .acciones button.principal { background: var(--color-primary); color: var(--color-on-primary); border-color: var(--color-primary); }
  .dialogo .acciones button.peligro { background: var(--color-danger); color: var(--color-on-danger); border-color: var(--color-danger); }
</style>
</head>
<body>
<!-- Iconos (Lucide, trazo de 2 px): un único set, incrustado para que valga sin conexión -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-play" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/></symbol>

// (null si se cancela) cuando se pide un campo. Los detalles técnicos van plegados, para quien los necesite.
function dialogo({ titulo = '', texto = '', aceptar = 'Aceptar', cancelar = null, peligro = false, campo = null, detalles = '' } = {}) {
  const d = $('dialogo');
  $('dialogoTitulo').textContent = titulo; $('dialogoTitulo').hidden = !titulo;
  $('dialogoTexto').textContent = texto; $('dialogoTexto').hidden = !texto;
  $('dialogoCampoLabel').hidden = campo === null; $('dialogoCampo').value = ''; $('dialogoCampo').placeholder = (campo && campo.ejemplo) || '';
  $('dialogoDetalles').hidden = !detalles; $('dialogoDetallesTexto').textContent = detalles; $('dialogoDetalles').open = false;
  $('dialogoAceptar').textContent = aceptar; $('dialogoAceptar').classList.toggle('peligro', peligro); $('dialogoAceptar').classList.toggle('principal', !peligro);
  $('dialogoCancelar').hidden = !cancelar; $('dialogoCancelar').textContent = cancelar || 'Cancelar';
  return new Promise(res => {
    d.onclose = () => { const ok = d.returnValue === 'ok'; res(campo !== null ? (ok ? $('dialogoCampo').value : null) : ok); };
    d.returnValue = '';

}

// Aviso de que no hay conexión: la app sigue funcionando con lo que el service worker tiene guardado
const indicarConexion = () => { $('sinConexion').hidden = navigator.onLine !== false; };
window.addEventListener('online', indicarConexion); window.addEventListener('offline', indicarConexion); indicarConexion();

// ---------- Coro por vocales ----------
// Muestras de coro real por vocal (a, e, i, o, u) en voces/<vocal>/<midi>.mp3 (ver voces/vocales.json, con los créditos).
// Cada archivo lleva un tramo en bucle para las notas largas. Misma interfaz que el Soundfont de smplr:
// start({ note, velocity, time, duration, vocal }) devuelve una función para cortar la nota.
class CoroVocales {
  constructor(ctx) {
    this.ctx = ctx; this.buffers = {}; this.salida = ctx.createGain(); this.salida.gain.value = 1.4; this.salida.connect(ctx.destination);
    this.load = (async () => {
      const info = await (await fetch('voces/vocales.json')).json();
      this.notas = info.notas; this.bucle = info.bucle;
      const tareas = [];
      for (const v of info.vocales) for (const n of info.notas) tareas.push((async () => {
        const datos = await (await fetch(`voces/${v}/${n}.mp3`)).arrayBuffer();
        this.buffers[v + n] = await ctx.decodeAudioData(datos);
      })());
      await Promise.all(tareas);
      return this;
    })();
  }
  start({ note, velocity = 100, time, duration, vocal }) {
    const v = this.buffers[(vocal || 'a') + this.notas[0]] ? (vocal || 'a') : 'a';
    // muestra más cercana en altura (a igual distancia, la de abajo: transportar hacia arriba oscurece menos)
    let mejor = this.notas[0];
    for (const n of this.notas) if (Math.abs(n - note) < Math.abs(mejor - note) || (Math.abs(n - note) === Math.abs(mejor - note) && n < mejor)) mejor = n;
    const buf = this.buffers[v + mejor]; if (!buf) return () => {};
    const ctx = this.ctx, t0 = time ?? ctx.currentTime;
    const src = ctx.createBufferSource(); src.buffer = buf; src.playbackRate.value = Math.pow(2, (note - mejor) / 12);
    src.loop = true; src.loopStart = this.bucle.inicio; src.loopEnd = this.bucle.fin;
    const g = ctx.createGain(); const nivel = Math.pow(velocity / 127, 1.2);
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(nivel, t0 + 0.01);
    src.connect(g); g.connect(this.salida);
    src.start(t0);
    const CAIDA = 0.18; // segundos de caída al soltar la nota
    let cortada = false;
    const parar = (t = ctx.currentTime) => {
      if (cortada) return; cortada = true;
      const tc = Math.max(t, ctx.currentTime);
      try { g.gain.cancelScheduledValues(tc); g.gain.setValueAtTime(g.gain.value, tc); g.gain.linearRampToValueAtTime(0, tc + CAIDA); src.stop(tc + CAIDA + 0.01); } catch {}
    };
    if (duration) parar(t0 + duration);
    src.onended = () => { try { src.disconnect(); g.disconnect(); } catch {} };

  }
}
// Vocal que se canta en una sílaba de la letra (castellano/latín): quita acentos, ignora la u muda de que/qui/gue/gui,
// y en los diptongos manda la vocal fuerte (a, e, o). Devuelve null si la sílaba no tiene vocal (p. ej. "-").
function vocalDeSilaba(texto) {
  if (!texto) return null;
  let t = String(texto).toLowerCase().replace(/ü/g, 'W').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/W/g, 'u');
  t = t.replace(/([qg])u(?=[ei])/g, '$1').replace(/y(?![aeiou])/g, 'i').replace(/[^a-z]/g, '');
  const vocales = t.match(/[aeiou]/g); if (!vocales) return null;
  const fuertes = vocales.filter(v => 'aeo'.includes(v));
  return fuertes.length ? fuertes[fuertes.length - 1] : vocales[vocales.length - 1];
}
// Primera estrofa de la letra de una entrada de voz de OSMD (LyricsEntries es un diccionario nº de verso → entrada):
// { texto: sílaba escrita en la nota, palabra: la palabra entera, indice: qué sílaba de la palabra es (0 = primera) }
function letraDe(ve) {
  const d = ve.LyricsEntries; if (!d) return null;
  let mejor = null;
  const ver = (clave, e) => { if (e && e.Text && (mejor === null || +clave < +mejor.clave)) mejor = { clave, e }; };
  if (d instanceof Map) d.forEach((e, k) => ver(k, e)); else if (typeof d.forEach === 'function') d.forEach(ver);
  if (!mejor) return null;
  const e = mejor.e, silabas = (e.Word && e.Word.Syllables) || [];
  const palabra = silabas.length > 1 ? silabas.map(x => x.Text || '').join('') : e.Text;
  return { texto: e.Text, palabra, indice: silabas.length > 1 ? Math.max(0, silabas.indexOf(e)) : 0, total: Math.max(1, silabas.length) };
}
const silabaDe = ve => { const l = letraDe(ve); return l && l.texto; };
const UNIT = 10; // OSMD dibuja en unidades de 10 px a zoom 1

// ---------- Estado ----------
let osmd, eventos = [], vozActiva = 0, instrumento = null, ctx = null;

// los compases en los que hay una segunda subvoz (acorde o voz 2 del MusicXML)
let subActiva = 0, divisi = [];
let reproduciendo = false, indiceEvento = 0, tInicio = 0, tOffset = 0, timerPlan = null, raf = null;
let sonando = []; // notas en curso para poder cortarlas al parar
let compasInicio = 0;

let listaObras = [], obraActual = null, posiciones = null, modoPdf = false, paginasPdf = [], pdfCargado = null;

const modoCorregir = new URLSearchParams(location.search).has('corregir');
const modoEditor = new URLSearchParams(location.search).has('editor') || modoCorregir;

// ---------- Carga ----------
async function cargarLista() {
  const lista = await (await fetch('partituras/lista.json')).json();
  listaObras = lista;

  const enEnsayo = lista.filter(o => o.ensayo), resto = lista.filter(o => !o.ensayo);
  const opcion = o => { const op = document.createElement('option'); op.value = o.archivo; op.textContent = (o.ensayo ? '★ ' : '') + o.titulo; return op; };
  const grupo = (nombre, obras) => { const g = document.createElement('optgroup'); g.label = nombre; obras.forEach(o => g.appendChild(opcion(o))); $('obra').appendChild(g); };

// Carga la obra en OSMD desde una dirección o desde el texto del MusicXML, y arregla las casillas de repetición
async function cargarEnOsmd(fuente) {
  const texto = fuente.trimStart().startsWith('<') ? fuente : await (await fetch(fuente)).text();
  await osmd.load(texto);
  arreglarCasillas(texto);

// OSMD solo se queda con el primer número de una casilla ("1, 2" → 1) y no cuenta las estrofas, así que una
// repetición con casillas "1, 2" y "3" la tocaría dos veces en vez de tres. Leemos los números del XML y
// completamos lo que falta en cada repetición.
function arreglarCasillas(texto) {
  let casillas = [];

    const doc = new DOMParser().parseFromString(texto, 'application/xml');
    const parte = doc.querySelector('part'); if (!parte) return;
    [...parte.querySelectorAll('measure')].forEach((m, i) => {
      for (const e of m.querySelectorAll('barline > ending[type="start"]')) {
        const nums = (e.getAttribute('number') || '').split(/[^0-9]+/).map(Number).filter(n => n > 0);
        if (nums.length > 1) casillas.push({ compas: i, nums });
      }
    });
  } catch (e) { console.warn('No se pudieron leer las casillas', e); return; }
  if (!casillas.length) return;
  for (const rep of osmd.Sheet.Repetitions) {
    const dict = rep.EndingIndexDict; let cambiado = false;
    for (const c of casillas) {
      if (c.compas < rep.StartIndex || c.compas > rep.EndIndex) continue;
      const parte = dict[c.nums[0]]; if (!parte) continue;
      for (const n of c.nums) if (!dict[n]) { dict[n] = parte; parte.endingIndices.push(n); cambiado = true; }
    }
    if (cambiado) {
      const max = Math.max(...Object.keys(dict).map(Number));

}

async function cargarObra(archivo) {
  parar();

// ---------- Vista PDF original ----------

// Las páginas son imágenes (generadas en el PC desde el PDF): cargan al instante y se pueden ampliar con los dedos
async function cargarPdf() {

    // Todas las páginas se cargan ya: si una página de más abajo aún no tiene imagen, mide 0 de alto y la barra

    const capa = document.createElement('div'); capa.className = 'capa'; capa.dataset.pagina = n;

// ---------- Apuntes sobre el PDF ----------
// Cada cantante escribe sobre la página (respiraciones, dinámicas, avisos…) con el dedo o el lápiz. Los trazos se
// guardan en este dispositivo, en coordenadas relativas a la página (0..1), así que valen a cualquier tamaño o zoom.
let apuntes = null, apuntando = false, utilApuntes = '#d32f2f', historialApuntes = [];
// Lápiz: en cuanto se detecta uno (Apple Pencil, S Pen…), los toques del dedo o de la mano apoyada dejan de escribir.
// Se recuerda en el dispositivo para que valga desde el primer trazo la próxima vez.
let conLapiz = false;
try { conLapiz = localStorage.getItem('apuntesLapiz') === '1'; } catch {}
if (conLapiz) document.body.classList.add('conLapiz');
function detectarLapiz() {
  if (conLapiz) return;

  if (apuntando) $('estado').textContent = 'Lápiz detectado: la mano apoyada ya no escribe ni mueve la página.';

// Un toque de dedo con mucha superficie es la palma o el canto de la mano, no la yema
const esPalma = ev => ev.pointerType === 'touch' && Math.max(ev.width || 0, ev.height || 0) > 60;

const puedeEscribir = ev => { if (ev.pointerType === 'pen') { detectarLapiz(); return true; } if (ev.pointerType === 'touch') return !conLapiz && !esPalma(ev); return true; };
const claveApuntes = () => 'apuntes:' + (obraActual && obraActual.archivo || '');
function cargarApuntes() {
  apuntes = null; historialApuntes = [];
  try { apuntes = JSON.parse(localStorage.getItem(claveApuntes()) || 'null'); } catch {}
  if (!apuntes || !Array.isArray(apuntes.paginas)) apuntes = { paginas: [] };
}
function guardarApuntes() {
  try { localStorage.setItem(claveApuntes(), JSON.stringify(apuntes)); }
  catch (e) { console.warn('No se pudieron guardar los apuntes', e); $('estado').textContent = 'No hay sitio para guardar los apuntes en este dispositivo.'; }
}
const trazosPagina = p => (apuntes.paginas[p] = apuntes.paginas[p] || []);

function crearLienzoApuntes(p) {
  if (!apuntes) cargarApuntes();
  const cv = document.createElement('canvas'); cv.className = 'apuntes'; cv.dataset.pagina = p;
  // El lienzo sigue el tamaño real de la página (que crece cuando llega la imagen) con la nitidez de la pantalla

    punteros.add(ev.pointerId);
    if (punteros.size > 1) { trazo = null; dibujarPagina(p); return; } // dos dedos: es un zoom, no un trazo
    ev.preventDefault(); cv.setPointerCapture(ev.pointerId);

    if (utilApuntes === 'goma') { borrarEn(p, x, y); return; }
    if (utilApuntes === 'texto') {
      pedirTexto('Apunte de texto', 'Se escribirá en el sitio de la página que has tocado.', 'p. ej. respirar').then(s => { if (s && s.trim()) anotar(p, { t: 'x', x, y, s: s.trim(), c: '#d32f2f' }); });
      return;
    }
    trazo = utilApuntes === 'resaltador' ? { t: 'r', c: '#ffe44d', p: [[x, y]] } : { t: 'l', c: utilApuntes, p: [[x, y]] };
  });
  cv.addEventListener('pointermove', ev => {
    if (!apuntando || punteros.size > 1 || !punteros.has(ev.pointerId)) return;
    const [x, y] = pos(ev);
    if (utilApuntes === 'goma') { if (punteros.has(ev.pointerId)) borrarEn(p, x, y); return; }
    if (!trazo) return;
    const u = trazo.p[trazo.p.length - 1];
    if (Math.hypot(x - u[0], y - u[1]) < 0.0015) return; // puntos demasiado juntos: no aportan nada
    trazo.p.push([x, y]);

  });

    if (!punteros.has(ev.pointerId)) return; // un toque ignorado (la mano) no cierra el trazo del lápiz
    punteros.delete(ev.pointerId);

    if (t.p.length === 1) t.p.push([t.p[0][0] + 0.001, t.p[0][1]]); // un toque: un punto visible

}
function anotar(p, trazo) {
  trazosPagina(p).push(trazo); historialApuntes.push({ p, trazo, borrado: false });
  guardarApuntes(); dibujarPagina(p);
}
// Goma: quita el trazo o texto que pase cerca del punto tocado
function borrarEn(p, x, y) {
  const lista = trazosPagina(p);
  const cerca = tr => tr.t === 'x' ? (x > tr.x - 0.012 && x < tr.x + 0.012 * tr.s.length + 0.012 && Math.abs(y - tr.y) < 0.02) : tr.p.some(([px, py]) => Math.hypot(px - x, py - y) < (tr.t === 'r' ? 0.02 : 0.012));
  const i = lista.findIndex(cerca); if (i < 0) return;

  guardarApuntes(); dibujarPagina(p);
}
function deshacerApunte() {
  const h = historialApuntes.pop(); if (!h) return;
  const lista = trazosPagina(h.p);
  if (h.borrado) lista.splice(Math.min(h.i, lista.length), 0, h.trazo); else { const i = lista.lastIndexOf(h.trazo); if (i >= 0) lista.splice(i, 1); }
  guardarApuntes(); dibujarPagina(h.p);
}
function dibujarPagina(p, enCurso) {
  const pg = paginasPdf[p]; if (!pg || !apuntes) return;
  const cv = pg.lienzo, r = cv.getBoundingClientRect(), k = devicePixelRatio || 1;
  const W = Math.round(r.width * k), H = Math.round(r.height * k); if (!W || !H) return;
  if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }

    if (tr.t === 'x') {

      ctx.fillText(tr.s, tr.x * W, tr.y * H); continue;

}
function activarApuntes(on) {
  if (on && document.body.classList.contains('controlesOcultos')) ocultarControles(false);
  apuntando = on;
  document.body.classList.toggle('apuntando', on);

  $('vistaApuntes').setAttribute('aria-pressed', on ? 'true' : 'false');
  if (on) $('estado').textContent = conLapiz ? 'Escribe con el lápiz; la mano apoyada no cuenta. Vuelve a tocar el lápiz para terminar.' : 'Escribe sobre la página con el dedo o el lápiz. Con dos dedos puedes ampliar. Vuelve a tocar el lápiz para terminar.';
  else if (modoPdf) $('estado').textContent = 'Toca un compás de la página para empezar desde ahí.';
}
$('vistaApuntes').onclick = () => activarApuntes(!apuntando);
// La barra fija de abajo cambia de alto (paleta de apuntes, filas que se parten en pantallas estrechas): el cuerpo deja ese hueco
const ajustarHueco = () => document.documentElement.style.setProperty('--alto-controles', document.querySelector('.controles').offsetHeight + 'px');
new ResizeObserver(ajustarHueco).observe(document.querySelector('.controles')); ajustarHueco();
for (const b of document.querySelectorAll('#barraApuntes button[data-color], #barraApuntes button[data-util]')) b.onclick = () => {
  utilApuntes = b.dataset.color || b.dataset.util;
  document.querySelectorAll('#barraApuntes button.activa').forEach(x => x.classList.remove('activa')); b.classList.add('activa');
};
$('apDeshacer').onclick = deshacerApunte;
$('apBorrar').onclick = async () => {
  if (!apuntes || !apuntes.paginas.some(l => l && l.length)) { $('estado').textContent = 'Esta obra no tiene apuntes que borrar.'; return; }
  if (!await confirmar('Borrar los apuntes', 'Se borrarán todos los apuntes de esta obra en este dispositivo. No se puede deshacer.', 'Borrar todo', true)) return;
  apuntes = { paginas: [] }; historialApuntes = []; guardarApuntes(); paginasPdf.forEach((_, p) => dibujarPagina(p));
};

// Barra sobre la página: en el compás del evento, a la fracción indicada (si no se da, la del propio evento)
function moverCursorPdf(ev, frac, centrar) {
  if (!posiciones || !paginasPdf.length || !ev) return;
  const c = posiciones.compases[ev.compas]; if (!c) return;
  paginasPdf.forEach((pg, i) => { if (i !== c.p) pg.cursor.style.display = 'none'; });
  const pg = paginasPdf[c.p]; if (!pg) return;
  frac = Math.max(0, Math.min(1, frac ?? ev.frac ?? 0));
  const s = pg.cursor.style;
  s.display = 'block'; s.left = ((c.x0 + frac * (c.x1 - c.x0)) * 100) + '%'; s.width = '1.6%';
  s.top = (c.y0 * 100) + '%'; s.height = ((c.y1 - c.y0) * 100) + '%';
  if (centrar) enfocar(pg.cursor);
}
// Fracción del compás en la que va la barra en el instante "ahora" (segundos reales): entre el evento i y el
// siguiente se desliza de forma continua, hasta el final del compás si el siguiente evento ya es de otro compás
function fraccionPdf(i, ahora, f) {
  const e = eventos[i], n = eventos[i + 1];
  if (!e) return 0;
  if (!n || n.seg <= e.seg) return e.frac;
  const destino = n.compas === e.compas ? n.frac : 1;
  const t = Math.max(0, Math.min(1, (ahora - e.seg / f) / ((n.seg - e.seg) / f)));
  return e.frac + (destino - e.frac) * t;
}
// Lleva el cursor a la vista desplazando SOLO esta página (scrollIntoView arrastraría también a la página
// que nos contiene cuando la app va dentro del Gestor de obras)
function enfocar(el) {
  const r = el.getBoundingClientRect();
  // Desplazamiento suave salvo que el sistema pida menos movimiento
  const suave = !matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (r.top < 60 || r.bottom > window.innerHeight - 220) window.scrollBy({ top: r.top + r.height / 2 - window.innerHeight / 2, behavior: suave ? 'smooth' : 'auto' });
}

$('vistaPartitura').onclick = async () => { if (!modoPdf) return; modoPdf = false; await aplicarModo(); moverCursor(indiceEvento); };
$('vistaPdf').onclick = async () => { if (modoPdf) return; modoPdf = true; await aplicarModo(); moverCursor(indiceEvento); };
try { modoPdf = localStorage.getItem(modoEditor ? 'modoPdfEditor' : 'modoPdf') === '1'; } catch {}

// Un botón por pentagrama; si el pentagrama se desdobla en dos o más compases (Contralto 1 / Contralto 2…), dos botones
function crearBotonesVoces() {
  const cont = $('voces'); cont.innerHTML = '';
  const instrumentos = osmd.Sheet.Instruments;
  if (vozActiva >= instrumentos.length) vozActiva = 0;
  instrumentos.forEach((ins, i) => {
    const nombre = ins.Name || ('Voz ' + (i + 1));
    const subs = seDesdobla(i) ? [1, 2] : [0];
    for (const sub of subs) {
      const b = document.createElement('button');
      b.textContent = sub ? nombre + ' ' + sub : nombre;
      b.dataset.parte = i; b.dataset.sub = sub;
      b.onclick = () => { vozActiva = i; subActiva = sub; marcarVoz(); ajustarVocesCanto(); };
      cont.appendChild(b);
    }
  });
  // que la selección siga siendo válida al cambiar de obra (o tras corregir notas)
  if (seDesdobla(vozActiva)) { if (!subActiva) subActiva = 1; } else subActiva = 0;
  marcarVoz();
}
const seDesdobla = parte => (divisi[parte] ? divisi[parte].size : 0) >= 2;
function marcarVoz() { [...$('voces').children].forEach(b => b.classList.toggle('activa', +b.dataset.parte === vozActiva && +b.dataset.sub === subActiva)); }
// ¿Esta nota es de la voz que se ensaya? En un pentagrama desdoblado, la subvoz 2 canta lo mismo que la 1 en los
// compases sin desdoble (unísono), así que ahí también cuenta como suya.
function esMia(n, compas) {
  if (n.parte !== vozActiva) return false;
  if (!subActiva) return true;
  if (n.sub === subActiva) return true;
  return subActiva === 2 && !divisi[n.parte].has(compas);
}


// ---------- Eventos musicales a partir del cursor de OSMD ----------
// Recorremos el cursor una vez (respeta repeticiones y casillas) y guardamos,
// para cada paso, el tiempo en segundos y las notas que empiezan ahí.
function construirEventos() {
  eventos = [];
  osmd.cursor.reset();
  const it = osmd.cursor.iterator; // ojo: reset() crea un iterador nuevo
  let segundos = 0, tsAnterior = it.CurrentEnrolledTimestamp.RealValue;
  const bpmDefecto = osmd.Sheet.DefaultStartTempoInBpm || 80;
  // Orden de las voces del MusicXML dentro de cada pentagrama (la primera es la de arriba, aunque el XML use otros números)
  const ordenVoz = osmd.Sheet.Instruments.map(ins => {
    const o = {}; [...new Set((ins.Voices || []).map(v => v.VoiceId))].sort((a, b) => a - b).forEach((id, k) => o[id] = k + 1); return o;
  });
  divisi = osmd.Sheet.Instruments.map(() => new Set());
  const ultimaVocal = {}; // por parte y voz del XML
  let paso = 0;
  let guarda = 0;
  while (!it.EndReached && guarda++ < 20000) {
    const ts = it.CurrentEnrolledTimestamp.RealValue;
    const bpm = it.CurrentBpm || bpmDefecto;
    segundos += (ts - tsAnterior) * 4 * 60 / bpm; // 1 redonda = 4 negras
    tsAnterior = ts;
    const notas = [];
    for (const ve of it.CurrentVoiceEntries) {
      if (ve.IsGrace) continue;
      const parte = osmd.Sheet.Instruments.indexOf(ve.ParentVoice.Parent);
      const subVoz = Math.min(2, ordenVoz[parte][ve.ParentVoice.VoiceId] || 1);
      // Subvoz de cada nota: la voz 2 del XML es la de abajo; en un acorde, la nota más aguda es la de arriba y el resto la de abajo
      const sonoras = ve.Notes.filter(n => n.Pitch && !n.isRest());
      const claveVoz = parte + ':' + ve.ParentVoice.VoiceId;
      const letra = letraDe(ve);
      const vocalSilaba = vocalDeSilaba(letra && letra.texto);
      if (vocalSilaba) ultimaVocal[claveVoz] = vocalSilaba;
      const vocal = ultimaVocal[claveVoz] || 'a';
      const masAguda = sonoras.reduce((m, n) => (!m || n.Pitch.halfTone > m.Pitch.halfTone ? n : m), null);
      for (const n of sonoras) {
        const sub = subVoz === 2 ? 2 : (sonoras.length > 1 && n !== masAguda ? 2 : 1);
        if (sub === 2) divisi[parte].add(it.CurrentMeasureIndex);
        if (n.NoteTie && n.NoteTie.StartNote !== n) continue; // nota ligada: no se vuelve a atacar
        let dur = n.Length.RealValue;
        if (n.NoteTie) dur = n.NoteTie.Notes.reduce((s, x) => s + x.Length.RealValue, 0);
        notas.push({ parte, sub, midi: n.Pitch.halfTone + 12, dur: dur * 4 * 60 / bpm, vocal, durQ: dur * 4, letra });
      }
    }
    // posición dentro del compás (0..1), para la marca en la vista PDF
    let frac = 0;
    try {
      const sm = osmd.Sheet.SourceMeasures[it.CurrentMeasureIndex];
      const tsm = (it.currentTimeStamp || it.CurrentSourceTimestamp);
      if (sm && tsm && sm.Duration.RealValue > 0) frac = (tsm.RealValue - sm.AbsoluteTimestamp.RealValue) / sm.Duration.RealValue;
    } catch {}
    eventos.push({ paso, seg: segundos, q: ts * 4, compas: it.CurrentMeasureIndex, frac, notas });
    it.moveToNextVisibleVoiceEntry(false); paso++; // mismo avance que cursor.next(), pero sin redibujar el cursor a cada paso
  }
  osmd.cursor.reset();
  if (eventos.length) console.log('Eventos:', eventos.length, 'duración', segundos.toFixed(1), 's · primera nota midi', eventos.find(e => e.notas.length)?.notas[0].midi, '· desdobles', divisi.map(d => d.size).join('/'));
  crearBotonesVoces();
}

// ---------- Voces cantadas ----------
// Datos para generar los proyectos del sintetizador de canto (el gestor los pide a la previsualización):
// una pista por voz (y por subvoz si hay desdobles), con la línea completa que canta esa voz.
window.datosCanto = () => {
  const partes = osmd.Sheet.Instruments.map((ins, i) => ins.Name || ('Voz ' + (i + 1)));
  const bpm = tempoPartitura;
  const pistas = [];
  partes.forEach((nombre, p) => {
    const subs = seDesdobla(p) ? [1, 2] : [0];
    for (const s of subs) {
      const notas = [];

  else if (a === 'borrar') { s.notas.splice(s.indice, 1); if (s.indice >= s.notas.length) s.indice = s.notas.length - 1; Compases.renumerar(s.notas); suena = false; }
  else if (a === 'anadir') { const c = JSON.parse(JSON.stringify(n)); c.letra = ''; c.ligaEmpieza = c.ligaTermina = false; c.compasEntero = false; c.acorde = false; c.adorno = false; c.indiceXml = undefined; s.notas.splice(s.indice + 1, 0, c); s.indice++; Compases.renumerar(s.notas); }

async function enviarCorreccion() {
  const nombre = obraActual.archivo;
  const xml = xmlActual.replace(/<score-partwise[^>]*>/, m => m + `\n<!-- Corregido en la app el ${new Date().toLocaleString('es-ES')} (${cambiosCorr} cambios) -->`);

if (modoCorregir) document.addEventListener('keydown', e => {
