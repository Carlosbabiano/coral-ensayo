<link rel="manifest" href="manifest.json">

<meta name="apple-mobile-web-app-capable" content="yes">

<style>
  :root {
    --bg: #fafaf7; --fg: #1d1d1b; --muted: #6b6b66; --line: #dcdcd6;
    --accent: #24407a; --accent-fg: #fff; --soft: #f0efe9;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; overflow-x: hidden; background: var(--bg); color: var(--fg); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; flex: 1 1 auto; display: flex; align-items: center; gap: 10px; }
  header h1 img { width: 40px; height: 40px; border-radius: 50%; }
  select, input[type=number] { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--fg); }
  .voces { display: flex; gap: 6px; }
  .voces button { flex: 1; padding: 10px 0; border: 1px solid var(--line); background: #fff; border-radius: 10px; font: inherit; font-weight: 600; color: var(--fg); }
  .voces button.activa { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  #partitura { padding: 8px 4px 220px; min-height: 60vh; position: relative; }
  /* Modo Corregir (para el director): barra dentro de la cabecera, que ya es fija */
  #barraCorregir { flex-basis: 100%; background: #fff7e6; border: 1px solid #f3dcae; border-radius: 10px; padding: 6px 10px; font-size: 14px; }
  #barraCorregir .fila { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
  #barraCorregir .fila + .fila { margin-top: 6px; }
  #barraCorregir button { padding: 6px 10px; min-width: 40px; font-size: 16px; border-radius: 8px; border: 1px solid var(--line); background: #fff; }
  #barraCorregir button.principal { background: var(--accent); color: #fff; border-color: var(--accent); font-size: 14px; }
  #barraCorregir button.peligro { color: #b3261e; border-color: #e6b8b5; }
  #barraCorregir select { padding: 6px; font-size: 14px; border-radius: 8px; border: 1px solid var(--line); }
  #barraCorregir .cuadra-mal { color: #b3261e; font-weight: 600; }
  #notaSel { position: absolute; border: 2px solid #e39b2c; border-radius: 50%; background: rgba(227,155,44,.28); pointer-events: none; z-index: 3; box-shadow: 0 0 0 3px rgba(227,155,44,.25); }
  #partitura svg { max-width: 100%; height: auto; }
  #estado { color: var(--muted); font-size: 13px; padding: 4px 12px; }
  .controles { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid var(--line); padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); display: grid; gap: 8px; z-index: 5; box-shadow: 0 -4px 16px rgba(0,0,0,.06); }
  .fila { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .fila label { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .fila input[type=range] { flex: 1; min-width: 80px; }
  .transporte button { font: inherit; font-size: 18px; padding: 10px 0; border-radius: 12px; border: 1px solid var(--line); background: var(--soft); color: var(--fg); flex: 1; }
  .transporte button.principal { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); flex: 2; }
  .transporte button:disabled { opacity: .5; }
  .chip { font-size: 13px; padding: 4px 10px; border-radius: 999px; background: var(--soft); border: 1px solid var(--line); }
  .chip input { vertical-align: middle; }
  #compas { font-variant-numeric: tabular-nums; font-weight: 600; }
  #cargando { position: fixed; inset: 0; background: rgba(250,250,247,.9); display: grid; place-items: center; z-index: 10; font-size: 16px; }
  .vista { display: flex; gap: 6px; margin: 8px 12px 0; }
  .vista button { flex: 1; padding: 6px 0; border: 1px solid var(--line); background: #fff; border-radius: 8px; font: inherit; font-size: 13px; color: var(--fg); }
  .vista button.activa { background: var(--soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  #pdfVista { display: none; padding: 8px 4px 220px; }
  .pagina { position: relative; margin: 0 auto 10px; box-shadow: 0 1px 6px rgba(0,0,0,.15); background: #fff; }
  .pagina img { display: block; width: 100%; height: auto; }
  .pagina .capa { position: absolute; inset: 0; }
  .pdfCursor { position: absolute; background: rgba(227,155,44,.35); border-left: 2px solid #e39b2c; pointer-events: none; transition: left .08s linear; }
</style>
</head>
<body>
<header>
  <h1><img src="icono-192.png" alt="">Coral Villa de Mengíbar</h1>
  <span id="pantalla" title="Pantalla" style="cursor:pointer;font-size:18px;opacity:.7">🌙</span>
  <select id="obra" title="Obra"></select>
  <div id="barraCorregir" style="display:none"></div>
</header>

<div style="padding: 8px 12px 0">
  <div class="voces" id="voces"></div>
</div>
<div class="vista" id="vista" style="display:none">
  <button id="vistaPartitura" class="activa">Partitura</button>
  <button id="vistaPdf">PDF original</button>
</div>
<div id="estado">Toca un compás de la partitura para empezar desde ahí.</div>
<div id="partitura"></div>
<div id="pdfVista"></div>

<div class="controles">
  <div class="fila transporte">
    <button id="inicio" title="Al principio">⏮</button>
    <button id="play" class="principal">▶ Reproducir</button>
    <button id="stop" title="Parar">■</button>
    <span class="chip">Compás <span id="compas">–</span></span>
  </div>
  <div class="fila">
    <label>Tempo <input type="range" id="tempo" min="30" max="208" value="80"> <span id="tempoVal" title="Toca para volver al tempo de la partitura" style="cursor:pointer;min-width:5.5em">♩ = 80</span></label>
    <label>Otras voces <input type="range" id="mezcla" min="0" max="100" value="25"> <span id="mezclaVal">25%</span></label>
  </div>
  <div class="fila">
    <label class="chip"><input type="checkbox" id="bucle"> Repetir compases
      <input type="number" id="desde" min="1" value="1" style="width:56px"> a
      <input type="number" id="hasta" min="1" value="1" style="width:56px"></label>
    <label>Sonido
      <select id="timbre">
        <option value="choir_aahs">Coro (aah)</option>
        <option value="acoustic_grand_piano">Piano</option>
        <option value="church_organ">Órgano</option>
        <option value="flute">Flauta</option>
      </select>
    </label>
  </div>
</div>

<div id="cargando">Cargando partitura…</div>

<script src="https://cdn.jsdelivr.net/npm/opensheetmusicdisplay@1/build/opensheetmusicdisplay.min.js"></script>
<script src="compases.js"></script>
<script type="module">
import { Soundfont } from "https://cdn.jsdelivr.net/npm/smplr/+esm";

const $ = id => document.getElementById(id);
const UNIT = 10; // OSMD dibuja en unidades de 10 px a zoom 1

// ---------- Estado ----------
let osmd, eventos = [], vozActiva = 0, instrumento = null, ctx = null;
let reproduciendo = false, indiceEvento = 0, tInicio = 0, tOffset = 0, timerPlan = null, raf = null;
let sonando = []; // notas en curso para poder cortarlas al parar
let compasInicio = 0;
// Vista "PDF original": la página del PDF con una marca que recorre los compases
let listaObras = [], obraActual = null, posiciones = null, modoPdf = false, pdfjs = null, paginasPdf = [], pdfCargado = null;
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.3.289/';

// ---------- Carga ----------
async function cargarLista() {
  const lista = await (await fetch('partituras/lista.json')).json();
  listaObras = lista;
  for (const o of lista) { const op = document.createElement('option'); op.value = o.archivo; op.textContent = o.titulo; $('obra').appendChild(op); }
  $('obra').onchange = () => cargarObra($('obra').value);
  await cargarObra(lista[0].archivo);
}

async function cargarObra(archivo) {
  parar();
  $('cargando').style.display = 'grid';
  if (!osmd) {
    osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay('partitura', {
      autoResize: true, drawTitle: true, drawPartNames: true, drawMeasureNumbers: true,
      followCursor: false, cursorsOptions: [{ type: 0, color: '#e39b2c', alpha: 0.55, follow: false }],
    });
  }
  if (modoCorregir) await cargarParaCorregir(archivo); else await osmd.load('partituras/' + archivo);
  osmd.Zoom = window.innerWidth < 600 ? 0.55 : 0.8;
  crearBotonesVoces();
  osmd.render();
  construirEventos();
  osmd.cursor.show();
  // ¿Tiene PDF original con posiciones de compases?
  obraActual = listaObras.find(o => o.archivo === archivo) || {};
  posiciones = null; paginasPdf = []; pdfCargado = null; $('pdfVista').innerHTML = '';
  if (obraActual.paginas && obraActual.paginas.length && obraActual.posiciones) {
    try { posiciones = await (await fetch('partituras/' + obraActual.posiciones)).json(); } catch (e) { console.warn('Sin posiciones', e); }
  }
  $('vista').style.display = posiciones ? 'flex' : 'none';
  if (!posiciones) modoPdf = false;
  await aplicarModo();
  prepararTempo(archivo);
  irACompas(0);
  $('hasta').value = osmd.Sheet.SourceMeasures.length;
  $('cargando').style.display = 'none';
}

// ---------- Vista PDF original ----------
async function aplicarModo() {
  $('vistaPartitura').classList.toggle('activa', !modoPdf);
  $('vistaPdf').classList.toggle('activa', modoPdf);
  // La partitura se oculta sin display:none para que OSMD no recalcule con tamaño cero
  Object.assign($('partitura').style, modoPdf ? { position: 'absolute', left: '-20000px', width: '100%', height: '0', overflow: 'hidden', padding: '0' } : { position: '', left: '', width: '', height: '', overflow: '', padding: '' });
  $('pdfVista').style.display = modoPdf ? 'block' : 'none';
  $('estado').textContent = modoPdf ? 'Toca un compás de la página para empezar desde ahí.' : 'Toca un compás de la partitura para empezar desde ahí.';
  if (modoPdf && !pdfCargado) await cargarPdf();
  try { localStorage.setItem('modoPdf', modoPdf ? '1' : '0'); } catch {}
}

// Las páginas son imágenes (generadas en el PC desde el PDF): cargan al instante y se pueden ampliar con los dedos
async function cargarPdf() {
  const cont = $('pdfVista'); cont.innerHTML = ''; paginasPdf = [];
  const anchoCss = Math.min(cont.clientWidth - 8, 900);
  obraActual.paginas.forEach((archivo, n) => {
    const div = document.createElement('div'); div.className = 'pagina'; div.style.width = anchoCss + 'px';
    const img = document.createElement('img'); img.src = 'partituras/' + archivo; img.alt = 'Página ' + (n + 1); img.decoding = 'async'; img.loading = n < 2 ? 'eager' : 'lazy';
    const capa = document.createElement('div'); capa.className = 'capa'; capa.dataset.pagina = n;
    capa.addEventListener('click', ev => {
      const r = capa.getBoundingClientRect(); const fx = (ev.clientX - r.left) / r.width, fy = (ev.clientY - r.top) / r.height;
      const p = +capa.dataset.pagina;
      const idx = posiciones.compases.findIndex(c => c && c.p === p && fx >= c.x0 && fx <= c.x1 && fy >= c.y0 && fy <= c.y1);
      if (idx >= 0) { irACompas(idx); $('estado').textContent = 'Empezará en el compás ' + (idx + 1); avisarCompasElegido(idx + 1); }
    });
    const cursor = document.createElement('div'); cursor.className = 'pdfCursor'; cursor.style.display = 'none';
    capa.appendChild(cursor); div.appendChild(img); div.appendChild(capa); cont.appendChild(div);
    paginasPdf.push({ div, cursor });
  });
  pdfCargado = true;
}

function moverCursorPdf(ev) {
  if (!posiciones || !paginasPdf.length || !ev) return;
  const c = posiciones.compases[ev.compas]; if (!c) return;
  paginasPdf.forEach((pg, i) => { if (i !== c.p) pg.cursor.style.display = 'none'; });
  const pg = paginasPdf[c.p]; if (!pg) return;
  const frac = Math.max(0, Math.min(1, ev.frac || 0));
  const s = pg.cursor.style;
  s.display = 'block'; s.left = ((c.x0 + frac * (c.x1 - c.x0)) * 100) + '%'; s.width = '1.6%';
  s.top = (c.y0 * 100) + '%'; s.height = ((c.y1 - c.y0) * 100) + '%';
  enfocar(pg.cursor);
}
// Lleva el cursor a la vista desplazando SOLO esta página (scrollIntoView arrastraría también a la página
// que nos contiene cuando la app va dentro del Gestor de obras)
function enfocar(el) {
  const r = el.getBoundingClientRect();
  if (r.top < 60 || r.bottom > window.innerHeight - 220) window.scrollBy({ top: r.top + r.height / 2 - window.innerHeight / 2, behavior: 'smooth' });
}

$('vistaPartitura').onclick = async () => { if (!modoPdf) return; modoPdf = false; await aplicarModo(); moverCursor(indiceEvento); };
$('vistaPdf').onclick = async () => { if (modoPdf) return; modoPdf = true; await aplicarModo(); moverCursor(indiceEvento); };
try { modoPdf = localStorage.getItem('modoPdf') === '1'; } catch {}

function crearBotonesVoces() {
  const cont = $('voces'); cont.innerHTML = '';
  osmd.Sheet.Instruments.forEach((ins, i) => {
    const b = document.createElement('button');
    b.textContent = ins.Name || ('Voz ' + (i + 1));
    b.onclick = () => { vozActiva = i; marcarVoz(); };
    cont.appendChild(b);
  });
  marcarVoz();
}
function marcarVoz() { [...$('voces').children].forEach((b, i) => b.classList.toggle('activa', i === vozActiva)); }


// ---------- Eventos musicales a partir del cursor de OSMD ----------
// Recorremos el cursor una vez (respeta repeticiones y casillas) y guardamos,
// para cada paso, el tiempo en segundos y las notas que empiezan ahí.
function construirEventos() {
  eventos = [];
  osmd.cursor.reset();
  const it = osmd.cursor.iterator; // ojo: reset() crea un iterador nuevo
  let segundos = 0, tsAnterior = it.CurrentEnrolledTimestamp.RealValue;
  const bpmDefecto = osmd.Sheet.DefaultStartTempoInBpm || 80;
  let paso = 0;
  let guarda = 0;
  while (!it.EndReached && guarda++ < 20000) {
    const ts = it.CurrentEnrolledTimestamp.RealValue;
    const bpm = it.CurrentBpm || bpmDefecto;
    segundos += (ts - tsAnterior) * 4 * 60 / bpm; // 1 redonda = 4 negras
    tsAnterior = ts;
    const notas = [];
    for (const ve of it.CurrentVoiceEntries) {
      if (ve.IsGrace) continue;
      const parte = osmd.Sheet.Instruments.indexOf(ve.ParentVoice.Parent);
      for (const n of ve.Notes) {
        if (!n.Pitch || n.isRest()) continue;
        if (n.NoteTie && n.NoteTie.StartNote !== n) continue; // nota ligada: no se vuelve a atacar
        let dur = n.Length.RealValue;
        if (n.NoteTie) dur = n.NoteTie.Notes.reduce((s, x) => s + x.Length.RealValue, 0);
        notas.push({ parte, midi: n.Pitch.halfTone + 12, dur: dur * 4 * 60 / bpm });
      }
    }
    // posición dentro del compás (0..1), para la marca en la vista PDF
    let frac = 0;
    try {
      const sm = osmd.Sheet.SourceMeasures[it.CurrentMeasureIndex];
      const tsm = (it.currentTimeStamp || it.CurrentSourceTimestamp);
      if (sm && tsm && sm.Duration.RealValue > 0) frac = (tsm.RealValue - sm.AbsoluteTimestamp.RealValue) / sm.Duration.RealValue;
    } catch {}
    eventos.push({ paso, seg: segundos, compas: it.CurrentMeasureIndex, frac, notas });
    osmd.cursor.next(); paso++;
  }
  osmd.cursor.reset();
  if (eventos.length) console.log('Eventos:', eventos.length, 'duración', segundos.toFixed(1), 's · primera nota midi', eventos.find(e => e.notas.length)?.notas[0].midi);
}

function irACompas(compas) {
  parar();
  let i = eventos.findIndex(e => e.compas >= compas);
  if (i < 0) i = 0;
  indiceEvento = i; compasInicio = i;
  moverCursor(i);
}
function moverCursor(i) {
  osmd.cursor.reset();
  for (let k = 0; k < i; k++) osmd.cursor.next();
  osmd.cursor.update();
  $('compas').textContent = (eventos[i]?.compas ?? 0) + 1;
  if (modoPdf) { moverCursorPdf(eventos[i]); return; }
  const el = osmd.cursor.cursorElement;
  if (el) enfocar(el);
}

// ---------- Audio ----------
async function prepararAudio() {
  if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === 'suspended') await ctx.resume();
  if (!instrumento || instrumento.nombre !== $('timbre').value) {
    $('estado').textContent = 'Cargando sonido…';
    const sf = new Soundfont(ctx, { instrument: $('timbre').value });
    await sf.load;
    sf.nombre = $('timbre').value;
    instrumento = sf;
    $('estado').textContent = '';
  }
}

// Tempo: el deslizador está en pulsaciones por minuto (negra); el factor se aplica sobre el tempo escrito en la partitura
let tempoPartitura = 80;
function factorTempo() { return $('tempo').value / tempoPartitura; }
function mostrarTempo() { $('tempoVal').textContent = '♩ = ' + $('tempo').value + ($('tempo').value == tempoPartitura ? '' : ' (' + Math.round(factorTempo() * 100) + '%)'); }
function prepararTempo(archivo) {
  tempoPartitura = Math.round(osmd.Sheet.DefaultStartTempoInBpm || 80);
  let v = tempoPartitura;
  try { const g = localStorage.getItem('tempo:' + archivo); if (g) v = +g; } catch {}
  $('tempo').value = Math.max(30, Math.min(208, v));
  mostrarTempo();
}
$('tempoVal').onclick = () => { $('tempo').value = tempoPartitura; $('tempo').dispatchEvent(new Event('input')); };
function rangoBucle() {
  if (!$('bucle').checked) return null;
  const d = Math.max(1, +$('desde').value) - 1, h = Math.max(d, +$('hasta').value - 1);
  const ini = eventos.findIndex(e => e.compas >= d);
  let fin = eventos.findIndex((e, i) => i > ini && e.compas > h);
  if (fin < 0) fin = eventos.length;
  return ini < 0 ? null : { ini, fin };
}

async function reproducir() {
  if (reproduciendo) { pausar(); return; }
  await prepararAudio();
  const b = rangoBucle();
  if (b && (indiceEvento < b.ini || indiceEvento >= b.fin)) indiceEvento = b.ini;
  reproduciendo = true;
  $('play').textContent = '❚❚ Pausa';
  const f = factorTempo();
  tInicio = ctx.currentTime + 0.15;
  tOffset = eventos[indiceEvento].seg / f;
  planificar();
  timerPlan = setInterval(planificar, 100);
  raf = requestAnimationFrame(seguirCursor);
}

// Programa las notas que caen en los próximos 0,4 s
function planificar() {
  const f = factorTempo(), mezcla = $('mezcla').value / 100, b = rangoBucle();
  const fin = b ? b.fin : eventos.length;
  const ahora = ctx.currentTime - tInicio + tOffset;
  while (indiceEvento < fin && eventos[indiceEvento].seg / f <= ahora + 0.4) {
    const e = eventos[indiceEvento];
    const t = tInicio + e.seg / f - tOffset;
    for (const n of e.notas) {
      const vel = n.parte === vozActiva ? 110 : Math.round(110 * mezcla);
      if (vel <= 0) continue;
      const stop = instrumento.start({ note: n.midi, velocity: vel, time: t, duration: Math.max(0.05, n.dur / f - 0.03) });
      sonando.push(stop);
    }
    indiceEvento++;
  }
  if (sonando.length > 200) sonando.splice(0, 100);
  if (indiceEvento >= fin) {
    const ultimo = eventos[fin - 1];
    const tFin = tInicio + (ultimo.seg + 1.5) / f - tOffset;
    if (ctx.currentTime >= tFin) {
      if (b) { indiceEvento = b.ini; tInicio = ctx.currentTime; tOffset = eventos[b.ini].seg / f; }
      else { parar(); irACompas(0); }
    }
  }
}

let cursorEn = -1;
function seguirCursor() {
  if (!reproduciendo) return;
  const f = factorTempo();
  const ahora = ctx.currentTime - tInicio + tOffset;
  // último evento cuyo tiempo ya ha pasado, dentro del tramo en curso
  let i = cursorEn < 0 ? 0 : cursorEn;
  const b = rangoBucle(); const fin = b ? b.fin : eventos.length; const ini = b ? b.ini : 0;
  if (i < ini || i >= fin) i = ini;
  while (i + 1 < fin && eventos[i + 1].seg / f <= ahora) i++;
  if (i !== cursorEn) { cursorEn = i; moverCursor(i); }
  raf = requestAnimationFrame(seguirCursor);
}

function pausar() {
  reproduciendo = false;
  clearInterval(timerPlan); cancelAnimationFrame(raf);
  for (const s of sonando) { try { s(ctx.currentTime); } catch {} }
  sonando = [];
  if (cursorEn >= 0) indiceEvento = cursorEn;
  cursorEn = -1;
  $('play').textContent = '▶ Reproducir';
}
function parar() { pausar(); }

// ---------- Interacción ----------
$('play').onclick = reproducir;
$('stop').onclick = () => { parar(); irACompas(eventos[compasInicio]?.compas ?? 0); };
$('inicio').onclick = () => irACompas(0);
$('tempo').oninput = () => { mostrarTempo(); try { localStorage.setItem('tempo:' + (obraActual.archivo || ''), $('tempo').value); } catch {} if (reproduciendo) { pausar(); reproducir(); } };
$('mezcla').oninput = () => $('mezclaVal').textContent = $('mezcla').value + '%';
$('timbre').onchange = () => { if (reproduciendo) { pausar(); reproducir(); } };

// ---------- Modo editor (dentro del Gestor de obras, con ?editor=1) y modo Corregir (para el director, con ?corregir=1): tocar una nota la selecciona ----------
const modoCorregir = new URLSearchParams(location.search).has('corregir');
const modoEditor = new URLSearchParams(location.search).has('editor') || modoCorregir;
let notaSel = null; // { compas (1..), staff (0..), indice (0.. dentro de la voz en ese compás), nota (gráfica) }
// Notas gráficas de un compás y un pentagrama, con su voz (1, 2…), su "entrada" (golpe dentro de la voz; las notas

  pintarBarraCorregir();
  clearTimeout(redibujoPendiente); redibujoPendiente = setTimeout(redibujarCorreccion, 400);
}
async function redibujarCorreccion() {
  const s = corr, y = window.scrollY;
  parar();
  await osmd.load(xmlActual);
  osmd.Zoom = window.innerWidth < 600 ? 0.55 : 0.8;
  osmd.render();
  construirEventos();
  osmd.cursor.show();
  irACompas(Math.max(0, (s ? s.compas : 1) - 1));
  window.scrollTo(0, y);
  seleccionCorr();
}
async function enviarCorreccion() {
  const nombre = obraActual.archivo;
  const xml = xmlActual.replace(/<score-partwise[^>]*>/, m => m + `\n<!-- Corregido en la app el ${new Date().toLocaleString('es-ES')} (${cambiosCorr} cambios) -->`);
  const archivo = new File([xml], nombre, { type: 'application/xml' });
  if (navigator.share && (!navigator.canShare || navigator.canShare({ files: [archivo] }))) {
    try { await navigator.share({ files: [archivo], title: 'Corrección de ' + obraActual.titulo }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const url = URL.createObjectURL(archivo); const a = document.createElement('a'); a.href = url; a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  alert('Se ha descargado ' + nombre + '. Mándaselo a Carlos (o déjalo en la carpeta Entrada de Google Drive).');
}
if (modoCorregir) document.addEventListener('keydown', e => {
  if (!corr) return;
  const t = e.target; if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA')) return;
  const k = e.key; let a = null, extra;
  if (k === 'ArrowUp') a = e.shiftKey ? 'sost' : 'arriba'; else if (k === 'ArrowDown') a = e.shiftKey ? 'bemol' : 'abajo';
  else if (k === 'ArrowLeft') a = 'izq'; else if (k === 'ArrowRight') a = 'der';
  else if (/^[1-6]$/.test(k)) { a = 'figura'; extra = ['whole', 'half', 'quarter', 'eighth', '16th', '32nd'][+k - 1]; }
  else if (k === '.' || e.code === 'Period') a = 'puntillo'; else if (k === 's' || k === 'S') a = 'silencio'; else if (k === 'l' || k === 'L') a = 'liga'; else if (k === 'a' || k === 'A') a = 'acorde';
  else if (k === 'Delete' || k === 'Backspace') a = 'borrar'; else if (k === '+' || k === 'Insert') a = 'anadir';
  else if (k === 'Escape') { corr = null; notaSel = null; marcarNota(null); pintarBarraCorregir(); return; }
  if (!a) return;
  e.preventDefault(); accionCorr(a, extra);
});

window.irACompas = irACompas; // para el Gestor de obras (previsualización): saltar a un compás desde fuera
